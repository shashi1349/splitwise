spring:
  application:
    name: splitwise
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: false
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    connect-retries: 3
    connect-retries-interval: 5

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Splitwise-Lite API

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-please-override-in-production-must-be-at-least-32-bytes}
    ttl-minutes: 120
    issuer: splitwise-lite
  cors:
    allowed-origin: ${APP_FRONTEND_ORIGIN:http://localhost:5173}

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:splitwise;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # Either provide SPRING_DATASOURCE_URL directly, or supply DB_HOST / DB_PORT / DB_NAME
    # individually (handy on Render where the managed Postgres exposes those as discrete fields).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:splitwise}}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Keep the pool small on free-tier hosts (Render's free web service is 0.1 CPU / 512 MB).
      # The TLS handshake to a remote managed Postgres takes ~1-2 s, so creating ten connections
      # at startup blew through Render's port-bind deadline.
      minimum-idle: 1
      maximum-pool-size: 5
      connection-timeout: 30000
      initialization-fail-timeout: 60000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
